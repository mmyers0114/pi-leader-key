name: CI

# Gates every change to main and every pull request. publish.yml only runs
# on version tags, so without this nothing checks a change until release.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 1.0.2 is what the lockfile pins; 1.1.0 is what pi ships and users
      # actually run. The suite must pass on both — dispatch reaches for
      # pi-tui's private submitValue(), which no .d.ts promises.
      matrix:
        peer: ["1.0.2", "1.1.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # `CI=true` makes the integration suites fail on a missing peer
      # instead of skipping, so a broken install cannot pass silently.
      - run: npm ci
      # --no-save: the peer range stays "*" per pi's docs/packages.md, so
      # the version under test is a job input, not a package.json change.
      - run: >-
          npm install --no-save
          @earendil-works/pi-tui@${{ matrix.peer }}
          @earendil-works/pi-coding-agent@${{ matrix.peer }}
      - run: npm test
        env:
          CI: "true"

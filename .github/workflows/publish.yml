name: Publish to npm

# Fires on version tags (v*). Publishes via OIDC trusted publishing —
# no tokens: the package's trusted-publisher entry on npmjs.com must
# name this repo + this filename and allow `npm publish`.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test
      - run: npx tsx __tests__/dispatch-matrix.test.ts
      # npm bundled with node may predate OIDC publish support (11.5.1+)
      - run: npm install -g npm@latest
      # setup-node exports github.token, which would override OIDC auth
      - run: |
          unset NODE_AUTH_TOKEN
          echo "npm=$(npm --version)"
          echo "oidc-url=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          npm publish --debug 2>publish-debug.log || true
          grep -iE 'oidc|identity|bearer|E[0-9]{3}' \
            publish-debug.log | grep -vi authToken | head -20 || true
          grep -m1 -iE 'npm error|npm notice publish' publish-debug.log || true
          test -s publish-debug.log && tail -3 publish-debug.log
          exit 1 # temporary diagnostic step
